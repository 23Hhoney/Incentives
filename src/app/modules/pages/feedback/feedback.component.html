<div class="container mt-4 mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" style="cursor: pointer;" aria-current="page" routerLink="/dashboards">Home</li>
        </ol>
    </nav>
    <div class="mt-3 mb-2">
        <div *ngIf="sectionsArray[0]?.items[0]?.text && publishedPage && showPublishedPage; else defaultHeading" [innerHTML]="sanitizeHtml(sectionsArray[0]?.items[0]?.text)"></div>
        <ng-template #defaultHeading>
            <h3 class="text-black">Feedback</h3>
        </ng-template>
    </div>
    <div class="card rounded-2xl">
        <div class="card-body">
            <div class="flex flex-wrap">
                <div class="w-full sm:w-1/4">
                    <div class="support flex flex-col items-center">
                        <svg width="33px" height="32px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="RGBA(13, 110, 253, 1)" class="bi bi-envelope">
                            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2zm13 2.383-4.758 2.855L15 11.114v-5.73zm-.034 6.878L9.271 8.82 8 9.583 6.728 8.82l-5.694 3.44A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.739zM1 11.114l4.758-2.876L1 5.383v5.73z"/>
                        </svg>
                        <div class="mt-6" style="width: 100%;">
                            <div *ngIf="sectionsArray[0]?.items[0]?.chartHeading && publishedPage && showPublishedPage; else defaultMail" [innerHTML]="sanitizeHtml(sectionsArray[0]?.items[0]?.chartHeading)"></div>
                            <ng-template #defaultMail>
                                <h6>If you have any issues submitting, please <a href="mailto: tritonsupport@kohlerpreferredpartners.com">email us</a></h6>
                            </ng-template>
                            <!-- <a style="width: 100%; line-break: anywhere;" href="'mailto:' + contactUsEmail">{{ contactUsEmail }}</a> -->
                        </div>
                    </div>
                </div>
                <div class="w-full sm:w-3/4">
                    <form [formGroup]="contactForm" (ngSubmit)="onSubmit($event)">
                        <div class="flex flex-wrap -mx-2">
                            <div class="w-full sm:w-1/3 px-2 mb-3">
                                <mat-form-field contact-us-mat-field class="w-full">
                                    <mat-label style="font-weight: 350; opacity: .7 !important; color: #00274b !important;">First Name</mat-label>
                                    <input matInput formControlName="firstName" />
                                    <mat-error *ngIf="contactForm.get('firstName')?.hasError('required')">
                                        First Name is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="w-full sm:w-1/3 px-2 mb-3">
                                <mat-form-field contact-us-mat-field class="w-full">
                                    <mat-label style="font-weight: 350; opacity: .7 !important; color: #00274b !important;">Last Name</mat-label>
                                    <input matInput formControlName="lastName" />
                                    <mat-error *ngIf="contactForm.get('lastName')?.hasError('required')">
                                        Last Name is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="w-full sm:w-1/3 px-2 mb-3">
                                <mat-form-field contact-us-mat-field class="w-full">
                                    <mat-label style="font-weight: 350; opacity: .7 !important; color: #00274b !important;">Phone Number</mat-label>
                                    <input matInput formControlName="phoneNumber" appPhoneNumberFormatter/>
                                    <mat-error *ngIf="contactForm.get('phoneNumber')?.hasError('required')">
                                        Phone Number is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="w-full px-2 mb-3">
                                <mat-form-field contact-us-mat-field class="w-full">
                                    <mat-label style="font-weight: 350; opacity: .7 !important; color: #00274b !important;">Email</mat-label>
                                    <input matInput type="email" formControlName="email" />
                                    <mat-error *ngIf="contactForm.get('email')?.hasError('required')">
                                        Valid Email is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="w-full px-2 mb-3">
                                <mat-form-field contact-us-desc-mat-field class="w-full">
                                    <mat-label style="font-weight: 350; opacity: .7 !important; color: #00274b !important;">Message</mat-label>
                                    <textarea id="desc-text-area" matInput rows="4" formControlName="message"></textarea>
                                    <mat-error *ngIf="contactForm.get('message')?.invalid">
                                        Message is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="w-full px-2 mb-3">
                                <input type="file" (change)="onFileSelected($event)" #fileInput style="display: none" accept="image/*">
                                <div style="display: flex;
                                border: 1px solid #d9dee3;
                                border-radius: 0.375rem;">
                                    <span style="width: 131px;
                                    height: 34px;
                                    margin-right: 10px;
                                    justify-content: center;
                                    align-items: center;
                                    font-size: 16px;
                                    display: flex;
                                    cursor: pointer;
                                    background: #d9dee3;
                                    border-radius: 0.375rem 0 0 0.375rem;" (click)="fileInput.click()">Choose File</span>
                                    <input style="height: 35px;
                                    padding-top: 1px;
                                    justify-content: center;
                                    cursor: pointer;
                                    display: flex;
                                    font-size: 16px;
                                    align-items: center;" matInput [value]="selectedImage && selectedImage.name ? selectedImage.name : selectedImage && !selectedImage.name ? selectedImage : ''" (click)="fileInput.click()" placeholder="No file chosen" readonly>
                                </div>
                            </div>
                            <div class="w-full px-2 text-right">
                                <button class="contact-us-submit" [disabled]="isLoading">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
