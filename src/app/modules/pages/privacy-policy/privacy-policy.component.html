<div class="container mt-6">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li
        class="breadcrumb-item active"
        style="cursor: pointer;"
        aria-current="page"
        (click)="getRouteLink()">
        {{ isTokenPresent ? 'Home' : 'Return to Sign In' }}
      </li>
    </ol>
  </nav>

  <!-- Page Heading -->
  <div class="mt-3 mb-2">
    <!-- <div
      *ngIf="
        iframeItems.length > 0 &&
        iframeItems[0]?.heading &&
        publishedPage &&
        showPublishedPage;
        else defaultHeading
      "
      style="width: 100%;"
      [innerHTML]="sanitizeHtml(iframeItems[0]?.heading)">
    </div> -->

    <ng-template #defaultHeading>
      <h3 class="text-black">Privacy Policy</h3>
    </ng-template>
  </div>

  <!-- Content -->
  <div class="card">
    <div class="card-body">

      <!-- CMS Iframes -->
      <ng-container
        *ngIf="
          iframeItems.length > 0 &&
          publishedPage &&
          showPublishedPage;
          else defaultMail
        ">

        <div *ngFor="let iframe of iframeItems" class="mb-5">

          <!-- Section Heading -->
          <div
            *ngIf="iframe.heading"
            class="mb-3"
            [innerHTML]="sanitizeHtml(iframe.heading)">
          </div>

          <!-- Iframe -->
          <iframe
            [src]="iframe.url"
            width="100%"
            [attr.height]="iframe.height"
            style="border: none;">
          </iframe>

        </div>
      </ng-container>

      <!-- Fallback -->
      <ng-template #defaultMail>
        <div class="full-width-cms-content">
          <h1 class="cms-header1">Privacy Policy</h1>
          <iframe
            src="https://www.corporate.kohler.com/privacy-statement"
            width="100%"
            height="5000">
          </iframe>

          <h2 class="cms-header2 mt-4">Cookie Policy</h2>
          <iframe
            src="https://www.kohlercompany.com/cookie-policy/"
            width="100%"
            height="2600">
          </iframe>
        </div>
      </ng-template>

    </div>
  </div>
</div>
