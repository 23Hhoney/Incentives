<form [formGroup]="dateSelectionForm" class="w-full date-selection-container p-4">
  <div class="date-row">
    <div class="date-option">
      <span class="radio-label">Login Date Range</span>
      <div class="my-2"></div>
      <div class="date-fields">
        <div class="field-container reduced-width">
          <mat-form-field login-report-mat-fields class="reduced-width">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startDatePicker1" formControlName="startDate">
            <mat-datepicker-toggle matSuffix [for]="startDatePicker1"></mat-datepicker-toggle>
            <mat-datepicker #startDatePicker1></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="field-container reduced-width">
          <mat-form-field login-report-mat-fields class="reduced-width">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endDatePicker1" formControlName="endDate">
            <mat-datepicker-toggle matSuffix [for]="endDatePicker1"></mat-datepicker-toggle>
            <mat-datepicker #endDatePicker1></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
  <mat-divider class="my-2"></mat-divider>

  <div class="user-fields-row" style="position: relative;">
    <div class="field-container reduced-width">
      <div class="and-text">AND</div>
      <mat-form-field login-report-mat-fields class="reduced-width">
        <mat-label>User Lookup</mat-label>
        <input type="text" matInput [formControl]="userSearchControl" [matAutocomplete]="auto" [matTooltip]="selectedUserTooltip"  matTooltipPosition="above"
          placeholder="Enter user name, email, or BP Number" />
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onUserSelected($event)">
          <mat-option *ngFor="let user of filteredUsers | async" [value]="user"
          matTooltip="{{ user.firstName }} {{ user.lastName }} - {{ user.email }} {{ user.bpNumber }}"
          >
            <span [innerHTML]="formatUserDisplay(user, userSearchControl.value)"></span>
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
      
    </div>
    <div class="field-container reduced-width">
     <div *ngIf="selectedFullname" class="mr-8" style="font-family: 'Open Sans', sans-serif; font-weight: 200; font-size: 20px; margin-top: 50px;">
      Participant Name: {{ selectedFullname }}
    </div>
    </div>
   
  </div>
  <div class="user-fields-row">
    <div class="field-container reduced-width">
      <div class="and-text">AND</div>
      <mat-form-field login-report-mat-fields class="reduced-width">
        <mat-label>Company (Optional)</mat-label>
        <input matInput formControlName="organization">
      </mat-form-field>
    </div>
  </div>
  <mat-divider class="my-2"></mat-divider>

  <button class="download-csv-btn" (click)="downloadCSV()">
    <span class="icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M14 6.5C14 6.63261 13.9473 6.75979 13.8536 6.85355C13.7598 6.94732 13.6326 7 13.5 7C13.3674 7 13.2402 6.94732 13.1464 6.85355C13.0527 6.75979 13 6.63261 13 6.5L13 3.7075L8.85437 7.85375C8.76055 7.94757 8.63331 8.00028 8.50062 8.00028C8.36794 8.00028 8.2407 7.94757 8.14688 7.85375C8.05305 7.75993 8.00035 7.63268 8.00035 7.5C8.00035 7.36732 8.05305 7.24007 8.14688 7.14625L12.2925 3L9.5 3C9.36739 3 9.24021 2.94732 9.14645 2.85355C9.05268 2.75979 9 2.63261 9 2.5C9 2.36739 9.05268 2.24021 9.14645 2.14645C9.24021 2.05268 9.36739 2 9.5 2L13.5 2C13.6326 2 13.7598 2.05268 13.8536 2.14645C13.9473 2.24021 14 2.36739 14 2.5L14 6.5ZM11.5 8C11.3674 8 11.2402 8.05268 11.1464 8.14645C11.0527 8.24021 11 8.36739 11 8.5L11 13L3 13L3 5L7.5 5C7.63261 5 7.75979 4.94732 7.85355 4.85355C7.94732 4.75979 8 4.63261 8 4.5C8 4.36739 7.94732 4.24021 7.85355 4.14645C7.75979 4.05268 7.63261 4 7.5 4L3 4C2.73478 4 2.48043 4.10536 2.29289 4.29289C2.10536 4.48043 2 4.73478 2 5L2 13C2 13.2652 2.10536 13.5196 2.29289 13.7071C2.48043 13.8946 2.73478 14 3 14L11 14C11.2652 14 11.5196 13.8946 11.7071 13.7071C11.8946 13.5196 12 13.2652 12 13L12 8.5C12 8.36739 11.9473 8.24021 11.8536 8.14645C11.7598 8.05268 11.6326 8 11.5 8Z"
          fill="white" />
      </svg>
    </span>
    Download .CSV File
  </button>
</form>
