<div class="table-container p-4">
  <div class="flex justify-end mb-4">
    <button *ngIf="!showPdf" 
            (click)="routeToPdf()" 
            style="min-height: 36px; padding: 0 25px; display: flex; align-items: center;" 
            class="bg-[#04202E] text-white py-2 rounded-lg">
      <span style="margin-left: 5px;">Click Here To View Keys</span>
    </button>
    <button *ngIf="showPdf" 
            (click)="backToTable()" 
            style="min-height: 36px; padding: 0 25px; display: flex; align-items: center;" 
            class="bg-[#04202E] text-white py-2 rounded-lg">
      <span style="margin-left: 5px;">Back to Email Template List</span>
    </button>
  </div>

  <div *ngIf="showPdf" class="pdf-container mt-4">
    <iframe [src]="iframeSrc" width="100%" height="600px" frameborder="0"></iframe>
  </div>

  <div *ngIf="!showPdf">
    <app-data-grid
      [gridSettings]="gridColumnsTab1"
      [dataSource]="dataSourceTab1"
      [loading]="loading"
      [pages]="pages"
      [pageIndex]="pageIndex"
      [totalRecordCount]="apiRequest.itemCount"
      (buttonClick)="handleButtonClick($event)"
      (fetchPageData)="onPageChange($event)"
      (sortChangeClick)="applySort($event)"
      (emitRecordCount)="changePageCount($event)">
    </app-data-grid>
  </div>
</div>
