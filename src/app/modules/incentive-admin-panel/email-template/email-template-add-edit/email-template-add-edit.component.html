<div class="containheight">
    <div class="flex flex-col flex-auto min-w-0 mt-4">
      <div class="max-w-7xl">
        <form [formGroup]="EmailForm">
          <div class="flex flex-col mt-2 p-6 pb-2 bg-card rounded-2xl shadow overflow-hidden">
            <!-- Form Fields -->
            <div class="flex flex-row gap-4">
              <mat-form-field class="w-1/2">
                <mat-label>Title *</mat-label>
                <input matInput formControlName="name" />
              </mat-form-field>
  
              <mat-form-field class="w-1/2">
                <mat-label>Subject *</mat-label>
                <input matInput formControlName="subject" />
              </mat-form-field>
            </div>
  
            <div class="flex flex-row gap-4">
              <mat-form-field class="w-1/2">
                <mat-label>From Email *</mat-label>
                <input matInput formControlName="fromEmail" />
              </mat-form-field>
  
              <mat-form-field class="w-1/2">
                <mat-label>To Email </mat-label>
                <input matInput formControlName="emailTo" />
              </mat-form-field>
          
            </div>
            <div class="flex flex-row gap-4">
                <mat-form-field class="w-1/2">
                    <mat-label>CC</mat-label>
                    <input matInput formControlName="emailCC" />
                  </mat-form-field>
                  <mat-form-field class="w-1/2">
                    <mat-label>Bcc</mat-label>
                    <input matInput formControlName="emailBcc" />
                  </mat-form-field>

            </div>
           
  
            <div style="margin-bottom: 1rem; display: flex; flex-direction: column; gap: 10px;">
                <span style="color: #04202E; font-size: 18px;">Body</span>
                <div style="border-radius: 4px; border: 1px solid #04202E; padding: 0; box-sizing: border-box;">
                  <ckeditor
                    [config]="editorConfig"
                    formControlName="body"
                    id="editor1"
                    [editor]="editor"
                    (ready)="onReady($event)"
                    #input2
                    style="width: 100%;"
                  ></ckeditor>
                </div>
              </div>
              
            <div class="flex items-center justify-end py-2">
              <button (click)="cancel()" class="ml-4 bulk-update-btn-cus" type="button">
                Cancel
              </button>
              <button (click)="SaveOrupdateEmail()" class="ml-4 bulk-update-btn-cus" type="button" [disabled]="isSavingemail">
                <div *ngIf="isSavingemail" class="flex items-center justify-center w-full">
                  <mat-progress-spinner [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
                </div>
                <span *ngIf="!isSavingemail">Save</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
