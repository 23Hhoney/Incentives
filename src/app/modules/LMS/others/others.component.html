<div class="w-full containheight mt-24">
    <div class="container ml-4 mt-3">
        <div class="flex-row align-items-center">
            <span
            [routerLink]="'../bathroom_faucets'"
            class="mb-2 textsmallblue" 
            [routerLink]="'/academy-curriculums'">&lt;&lt; Academy Curriculums </span>
            <span *ngIf="curriculumName"
            class="mb-2 textsmallblue" > &lt;&lt; {{curriculumName}}</span>
        </div>
    </div>
    <div class="container mt-3 mb-3">
        <div class="d-flex justify-content-between mt-4 mb-4 pb-2 pt-4" style="justify-content: space-between;">
            <h4 class="text-black" style="font-size: 24px !important;">
                {{curriculumName}}
            </h4>
            <div class="acedemyInfo">
                <span class="mr-4"><span class="text-danger" style="color:red"> <i class="fa-solid fa-asterisk"></i></span> = Required</span>
                <span><span class="text-success"><i class="fa-regular fa-circle-check"></i></span> = Passed</span>
            </div>
        </div>
        <hr class="container mb-4 mt-4" style="border-bottom: 1px solid #afafaf;">
        <div class="row d-flex flex-wrap">

            <!-- <div class="col-lg-12 col-md-12 col-sm-12 d-flex flex-column justify-content-between w-full">
                <div class="container mb-2">
                    <div class="ms-2 c-details">
                        <h4 class="text-black mt-3 mb-4">
                            {{curriculumName}}
                        </h4>
                    </div>
                </div>
                <div class="acedemyInfo">
                    <span class="me-3"><span class="text-danger" style="color:red"> *</span> = Required</span>
                    <span><span class="text-success"><i class="fa-regular fa-circle-check"></i></span> = Passed</span>
                </div>
            </div>
 -->
          

            <!-- <div class="accordion accordion-flush viewallCourse-accordian"> -->
                <div  class="container mb-3 mt-3 mx-3" style="background: white;padding: 5px;width: 100%;">
                    <div class="accordion accordion-flush viewallCourse-accordian" id="accordionExample">
                        <div *ngFor="let item of items; index as index" [ngStyle]="{ 'border-bottom': items.length -1 > index ? '1px solid #dee2e6' : '0', 'margin-bottom': items.length -1 > index ? '10px' : '0'}">
                            <mat-accordion [hideToggle]="true">
                                <mat-expansion-panel [disabled]="true"
                                [expanded]="item.isOpen"
                                (opened)="item.isOpen = true"
                                (closed)="item.isOpen = false">
                                <mat-expansion-panel-header [className]="'w-10/12'">
                                    <mat-panel-title >
                                        <div class="grid grid-cols-12 gap-4 w-full filter-section" >
                                            <div class="col-span-7 w-full p-2">
                                                <div class="flex">
                                                    
                                                    <sup *ngIf="item.isRequred || item.status==='Pass'" [ngClass]="{'text-success':item.status==='Pass', 'text-danger':item.isRequred&&item.status!=='Pass' }" class="" style="margin-top: 4px;"><i [ngClass]="{'fa-regular fa-circle-check':item.status==='Pass', 'fa-solid fa-asterisk':item.isRequred&&item.status!=='Pass' }" ></i></sup> 
                                                    <!-- <span *ngIf="item.isRequred" style="top: -3px; position: relative;"><img src="assets/images/asteric.png" style="width: 12px;"> </span> -->
                                                    &nbsp; <a [routerLink]="['/kohler-studio', item.courseId]">
                                                        <div class="flex-item"> {{item.name}} >></div>
                                                    </a>
                                                </div>
                                            </div>
                                            <div class="col-span-3 w-full p-2">
                                                <span><img src="assets/images/kohler_logo.png" class="logo" style="width: 64px; vertical-align: middle;"></span>
                                            </div>
                                            <div class="col-span-2 w-full p-2">
                                                <span class="flex" >
                                                    <span (click)="item.isOpen=!item.isOpen" style="font-weight: bold; font-size: 16px;"> More Info </span>
                                                    <mat-icon (click)="item.isOpen=!item.isOpen" [svgIcon]="item.isOpen?'heroicons_outline:chevron-up':'heroicons_outline:chevron-down'"></mat-icon>
                                                </span>
                                            </div>
                                        </div>
                                    </mat-panel-title>
                                </mat-expansion-panel-header>
                                <div style="display: flex; gap: 10px; align-items: center;;">
                                    <img *ngIf="item.imageUrl" style="height: 50px; width: 100px; border: 1px solid #7E7E7E; border-radius: 6px;" [src]="item.imageUrl" alt="">
                                    <div style="color: #212429; font-size: 15px; padding-top: 10px; font-weight: 300;font-family: HelveticaNeueLight">
                                        {{item.description}}
                                    </div>
                                </div>
                            </mat-expansion-panel>
                            </mat-accordion>
                        </div>
                    </div>
                </div>
            <!-- </div> -->

        </div>
    </div>
</div>
