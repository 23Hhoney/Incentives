<div class="w-full mt-24">
    <div class="container mt-3">
        <div class="flex-row align-items-center">
            <span
            [routerLink]="'../bathroom_faucets'"
            class="mb-2 textsmallblue" 
            style="
            cursor: pointer;
            font-weight: 400;
            font-size: 16px;
            color: #0088cc;
            font-family: HelveticaNeueMedium"
            [routerLink]="'../academy-curriculums'">&lt;&lt; ACADEMY CURRICULUMS</span>
        </div>
    </div>
    <div class="col-lg-12 col-md-12 col-sm-12 flex flex-column justify-content-between w-full p-3">
        <div class="container mb-2">
            <div class="ms-2 c-details">
                <span style="
                color: #000000;
                font-size: 30px;
                font-weight: 600;
                font-family: HelveticaNeuelight;">
                    BATHROOM FAUCETS
                </span>
            </div>
        </div>
    </div>
    
      <mat-divider class="ml-2"></mat-divider>
      <div class="container mt-3 mb-3">
        <div class="row flex flex-wrap">
            <div class="col-lg-12 col-md-12 col-sm-12 flex flex-col justify-between">
                <div class="container mb-3 mt-3 bg-white p-5">
                    <div class="accordion accordion-flush" id="accordionExample">
                        <div *ngFor="let item of items; index as i" class="border-b last:border-0 mb-2 last:mb-0">
                            <mat-accordion>
                                <mat-expansion-panel (opened)="item.isOpen = true" (closed)="item.isOpen = false">
                                    <mat-expansion-panel-header class="border-b" [class.border-b-0]="!item.isOpen">
                                        <mat-panel-title>
                                            <div class="flex justify-between w-full">
                                                <div class="flex-item">{{ item.title }}</div>
                                                <div class="flex-item">{{ item.subtitle }}</div>
                                                <div class="flex-item">More Info</div>
                                            </div>
                                        </mat-panel-title>
                                    </mat-expansion-panel-header>
                                    <div class="text-gray-800 text-lg pt-4 font-light">
                                        {{ item.content }}
                                    </div>
                                </mat-expansion-panel>
                            </mat-accordion>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
